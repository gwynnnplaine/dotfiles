# Herdr config — tailored for cmux habits + Pi running inside panes.
# Docs: https://herdr.dev/docs/configuration/
# Reload after edits: `herdr server reload-config` (or `reload config` in the menu).

# Skip the first-run onboarding wizard (we configure everything here).
onboarding = false

[experimental]
# Render inline images (Kitty graphics protocol) in panes. Without this, Pi
# can "see" an image (sent to the model) but the pane never paints it.
kitty_graphics = true

[terminal]
default_shell = "nu"   # Nushell in newly created panes
shell_mode = "auto"    # macOS: login shell so brew/PATH init runs in new panes

[theme]
# Mirror Ghostty: Gruvbox Dark / Gruvbox Light, auto-switch with the OS.
# Same palette as Ghostty's built-ins and pi's `pi-themes` gruvbox pair
# (dark #282828/#ebdbb2, light #fbf1c7/#3c3836), so panes and Pi match exactly.
name = "gruvbox"
auto_switch = true
light_name = "gruvbox-light"
dark_name = "gruvbox"

[ui]
# Sort the agents panel by urgency: blocked, then done, then working, then idle.
# The agent that needs you floats to the top of the list.
agent_panel_sort = "priority"
sidebar_width = 32                        # wider sidebar (default 26)
sidebar_collapsed_mode = "hidden"
right_click_passthrough_modifier = "ctrl" # ctrl+right-click goes to the pane app, not Herdr's menu
status_indicators = "dots"                # compact dot per agent state instead of text badges
show_agent_labels_on_pane_borders = true  # agent name rides the pane border, not the sidebar only

[ui.sound]
enabled = true         # short beep when an agent finishes / needs input

[ui.toast]
delivery = "terminal"  # in-terminal toast (was "system"; live config had this reverted by hand)

[keys]
# Prefix = Ctrl+; (semicolon). Chosen over Ctrl+Space because Ctrl+Space is
# taken by macOS input-source (language) switching, and Ctrl+B by Pi. Ctrl+;
# avoids both and needs no macOS changes. (If a pane app ever doesn't receive
# ctrl+; it's a terminal transmission issue, not a Herdr one.)
# Daily rule: press Ctrl+;, release, then ONE letter. Examples:
#   Ctrl+; c        new tab
#   Ctrl+; d        split right   |  Ctrl+; -   split down
#   Ctrl+; shift+n  new workspace |  Ctrl+; w   workspace picker
#   Ctrl+; z        zoom pane     |  Ctrl+; x   close pane
#   Ctrl+; q        detach        |  Ctrl+; ?   show all keybindings
# Everything not listed below keeps Herdr's defaults (all prefix-first).
prefix = "ctrl+semicolon"

# Move focus between panes with ONE chord: Ctrl+h/j/k/l (trivial with Caps->Ctrl).
# TRADE-OFF: Herdr grabs these globally, so inside Pi you lose ctrl+j (new line),
# ctrl+k (delete to EOL), ctrl+l (model select), ctrl+h (backspace). Use Shift+Enter
# for a new line in Pi. Prefix form (Ctrl+; then h/j/k/l) is kept as a fallback.
focus_pane_left  = ["ctrl+h", "prefix+h"]
focus_pane_down  = ["ctrl+j", "prefix+j"]
focus_pane_up    = ["ctrl+k", "prefix+k"]
focus_pane_right = ["ctrl+l", "prefix+l"]

# Resize mode: Ctrl+; r, then h/j/k/l (Esc exits). This is herdr's default, kept
# explicit because a plugin binding once shadowed prefix+r.
resize_mode = "prefix+r"

# Splitting panes, cmux-style:
#   Ctrl+Space d   split right (side by side)  <- like cmux Cmd+D
#   Ctrl+Space -   split down  (stacked)       <- minus = horizontal divider
# (mouse: right-click in a pane -> Split right / Split down)
split_vertical   = ["prefix+d", "prefix+v"]
split_horizontal = ["prefix+minus"]

# Open an existing git worktree of the current repo as its own grouped workspace.
# Ctrl+Space Shift+O  (mouse: right-click the repo row -> Open worktree...)
open_worktree = "prefix+shift+o"

# Creating worktrees goes through the worktrunk plugin (see below), which runs
# the lifecycle hooks in ~/.config/worktrunk/config.toml. herdr's built-in
# new_worktree has no hook system, so its key is freed for the plugin instead.
new_worktree = ""

# Jump to a workspace (project) by number: Ctrl+; 1 .. 9 (plain digits, reliable).
# Shift+digit was unreliable: the terminal sends ! @ # ... instead of shift+1/2/3.
# Trade-off: tabs lose number-jump; switch tabs with Ctrl+; n / Ctrl+; p instead.
switch_workspace = "prefix+1..9"
switch_tab = ""

# Step to the previous / next workspace (project): Ctrl+; , and Ctrl+; .
previous_workspace = "prefix+comma"
next_workspace = "prefix+period"

# Jump to an agent by number: Ctrl+; then Alt+1 .. Alt+9.
# NOTE: with agent_panel_sort = "priority" the order shifts (urgent floats up),
# so the number maps to the CURRENT sorted position, not a fixed agent.
focus_agent = "prefix+alt+1..9"

# --- Plugin: plannotator.herdr-annotate ---
# Annotate copied terminal text; collect comments as Markdown for agents.
# Uses the plugin's README default keys:
#   Ctrl+; a        capture a note for the current selection
#   Ctrl+; shift+a  copy all annotations as Markdown context
#   Ctrl+; m        manage annotations (browse / copy / archive)
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate selection"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# --- Plugin: worktrunk (devashish2203/herdr-worktrunk) ---
# Worktree switch/create through `wt`, so worktrunk's pre-start hooks run and
# the checkout still opens as a native herdr worktree workspace.
#   Ctrl+; shift+g   picker, new branches based on the default branch
#   Ctrl+; alt+g     same picker, new branches based on the current branch
# The remaining actions (remove, merge, merge --no-squash, remote branches)
# stay on the workspace menu: right-click the workspace row.
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "worktree: switch / create (default base)"

[[keys.command]]
key = "prefix+alt+g"
type = "plugin_action"
command = "worktrunk.open-current"
description = "worktree: switch / create (current base)"

# --- lazygit popup (0.7.4 `type = "popup"`) ---
# Session-modal floating terminal: grabs all input (incl. Esc) until lazygit
# exits, and leaves the tiled split layout untouched. cmux-style git overlay
# that vanishes on quit, instead of a dedicated split. `prefix+t` is free
# (rename_tab is prefix+shift+t, cycle_pane_next is prefix+tab).
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"
