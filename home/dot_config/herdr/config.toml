# Herdr — https://herdr.dev/docs/configuration/
# Apply edits with `herdr server reload-config`.

onboarding = false

[experimental]
kitty_graphics = true  # without it Pi sees an image but the pane never paints it

[terminal]
default_shell = "nu"
shell_mode = "auto"    # login shell, so brew/PATH init runs in new panes

[theme]
# Same gruvbox pair as Ghostty and pi-themes, so panes and Pi match exactly.
name = "gruvbox"
auto_switch = true
light_name = "gruvbox-light"
dark_name = "gruvbox"

[ui]
agent_panel_sort = "priority"  # blocked > done > working > idle
sidebar_width = 32
sidebar_collapsed_mode = "hidden"
right_click_passthrough_modifier = "ctrl"
status_indicators = "dots"
show_agent_labels_on_pane_borders = true

[ui.sound]
enabled = true

[ui.toast]
delivery = "terminal"

[keys]
# Ctrl+; because Ctrl+Space is macOS input-source switching and Ctrl+B is Pi.
# A pane app not receiving it is a terminal transmission issue, not a herdr one.
# Unlisted actions keep herdr's defaults; `Ctrl+; ?` lists them all.
prefix = "ctrl+semicolon"

# One chord instead of prefix+letter. Costs ctrl+h/j/k/l inside Pi (backspace,
# newline, delete-to-EOL, model select) — use Shift+Enter for a newline there.
focus_pane_left  = ["ctrl+h", "prefix+h"]
focus_pane_down  = ["ctrl+j", "prefix+j"]
focus_pane_up    = ["ctrl+k", "prefix+k"]
focus_pane_right = ["ctrl+l", "prefix+l"]

resize_mode = "prefix+r"  # explicit: a plugin binding once shadowed it

split_vertical   = ["prefix+d", "prefix+v"]  # d like cmux Cmd+D
split_horizontal = ["prefix+minus"]          # minus = horizontal divider

# Worktrees run through the worktrunk plugin only (prefix+f, below): it has
# lifecycle hooks, which the native commands lack. The `herdr worktree open`
# CLI still runs — the plugin calls it to register the checkout.
new_worktree = ""
open_worktree = ""

# Digits go to workspaces: shift+digit was unreliable (the terminal sends ! @ #)
# and tabs still have prefix+n / prefix+p.
switch_workspace = "prefix+1..9"
switch_tab = ""

previous_workspace = "prefix+comma"
next_workspace = "prefix+period"

# Priority sorting reshuffles the panel, so a number means the current row.
focus_agent = "prefix+alt+1..9"

# --- Plugin: plannotator/herdr-annotate (README default keys) ---
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate selection"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# --- Plugin: devashish2203/herdr-worktrunk ---
# f as in fzf; only f/i/u/y were free. Remove, merge, and the current-base and
# remote-branch pickers stay on the workspace menu (right-click the row).
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "worktrunk.open"
description = "worktree: switch / create"

# --- lazygit ---
# popup, not a split: session-modal (grabs Esc) and leaves the layout alone.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"
