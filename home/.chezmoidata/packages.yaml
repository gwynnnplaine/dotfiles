# Declarative package lists consumed by .chezmoiscripts/run_onchange_* scripts.
# Editing a list re-runs the matching script on the next `chezmoi apply`.

# Homebrew formulae and casks, piped to `brew bundle` by
# run_onchange_before_install-brew-packages. Fully qualified names
# (owner/tap/name) tap automatically. The list is authoritative: removing an
# entry uninstalls it. Packages from third-party taps need `trusted: true`
# (Homebrew refuses to load untrusted taps); cleanup resets Homebrew's trust
# store to exactly these entries.
brew:
  formulae:
    - "fd"
    - "fzf"
    - "gh"
    - "bat"
    - "btop"
    - "carapace"
    - "eza"
    - "git"
    - "git-delta"
    - "herdr"
    - "jq"
    - "lazygit"
    - "make"
    - "nushell"
    - "ripgrep"
    - "shellcheck"
    - "terminal-notifier"
    - "tree-sitter-cli"
    - "worktrunk"
    - { name: "jandedobbeleer/oh-my-posh/oh-my-posh", trusted: true }
    - "chezmoi"
    - "yazi"
    - "zoxide"
    - { name: "keidarcy/tap/e1s", trusted: true }
    - "pnpm"
    - "awscli"
    - { name: "atlassian/acli/acli", trusted: true }
    - { name: "oven-sh/bun/bun", trusted: true }
    # Local services for indiecampers (Rails). Data lives in
    # /opt/homebrew/var/postgresql@17; start with `brew services start <name>`.
    - "postgresql@17"
    - "postgis"
    - "redis"
  casks:
    - "alt-tab"
    - "ghostty"
    - "font-iosevka-nerd-font"
    - "font-maple-mono"
    - "font-geist-mono"
    - "font-monaspace"
    - "session-manager-plugin"
    - "vorssaint"
    - { name: "crmne/tap/spotifast", trusted: true }
    - { name: "crmne/tap/zapfast", trusted: true }
    - "orbstack"
    - "helium-browser"
    - "slack"
    - "raycast"
    - "telegram"
    - "obsidian"
    - "shottr"
    - "figma"
    - "stremio"

# Global npm CLIs installed with `vp install -g` (Vite+ manages Node).
# See run_onchange_install-npm-globals.sh.tmpl.
npm_globals:
  - "typescript-language-server" # TS/JS LSP (supi-lsp)
  - "typescript" # tsserver backing typescript-language-server
  - "bash-language-server" # Bash/sh/zsh LSP (supi-lsp); shellcheck via brew.formulae
  - "vscode-langservers-extracted" # provides vscode-html-language-server (+css/json/eslint)
